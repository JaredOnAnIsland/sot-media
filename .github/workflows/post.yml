name: Post due Instagram queue entries
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ig-queue
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Post what is due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git config user.name "sot-queue"
          git config user.email "sot-queue@users.noreply.github.com"
          python poster.py
